# ==============================================================================
# CONFIGURACIÓN MOSQUITTO MQTT BROKER (IC_IV IoT)
# ==============================================================================

# Persistencia de datos en disco
persistence true
persistence_location /mosquitto/data/

# Logs del sistema
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log

# ------------------------------------------------------------------------------
# LISTENER MQTT TCP (Puerto estándar 1883)
# ------------------------------------------------------------------------------
listener 1883
allow_anonymous true

# ------------------------------------------------------------------------------
# LISTENER WEBSOCKETS (Puerto 9001 para navegadores / Dashboards)
# ------------------------------------------------------------------------------
listener 9001
protocol websockets
allow_anonymous true
